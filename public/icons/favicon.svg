<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 150 384 384"><rect x="72" y="150" width="384" height="384" rx="84" fill="#1f5a66"/>
  <defs>
    <!-- colour follows height, like the app: low = red, high = green -->
    <linearGradient id="energy" x1="0" y1="440" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3232f"/><stop offset="0.2" stop-color="#db602d"/>
      <stop offset="0.4" stop-color="#f1b13d"/><stop offset="0.6" stop-color="#c3c753"/>
      <stop offset="0.8" stop-color="#6aa55f"/><stop offset="1" stop-color="#2f8a5e"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f4bd67"/><stop offset="1" stop-color="#d4862f"/>
    </radialGradient>
  </defs>
  <!-- the day's energy curve: the dormouse naps on top of it -->
  <path d="M 64 440 C 168 440 176 334 256 334 C 336 334 344 440 448 440" fill="none" stroke="url(#energy)" stroke-width="26" stroke-linecap="round"/>
  <!-- big fluffy tail curling up behind -->
  <path d="M 164 300 C 104 296 88 222 128 196 C 164 172 204 196 192 228" fill="none" stroke="#c77c2b" stroke-width="46" stroke-linecap="round"/>
  <path d="M 158 296 C 114 290 104 232 132 210 C 156 192 184 204 184 222" fill="none" stroke="#f0b35e" stroke-width="12" stroke-linecap="round" opacity=".75"/>
  <!-- body -->
  <ellipse cx="238" cy="288" rx="92" ry="54" fill="url(#fur)"/>
  <!-- ears -->
  <circle cx="294" cy="226" r="23" fill="#cf8430"/>
  <circle cx="294" cy="228" r="12" fill="#efa597"/>
  <!-- head -->
  <circle cx="318" cy="276" r="52" fill="url(#fur)"/>
  <circle cx="334" cy="222" r="21" fill="#e09a44"/>
  <circle cx="334" cy="224" r="11" fill="#efa597"/>
  <!-- muzzle, nose, closed eye, cheek -->
  <ellipse cx="350" cy="296" rx="27" ry="19" fill="#f8deb2"/>
  <circle cx="372" cy="288" r="7" fill="#b35757"/>
  <path d="M 311 272 Q 324 284 337 272" fill="none" stroke="#3a2418" stroke-width="6.5" stroke-linecap="round"/>
  <ellipse cx="314" cy="297" rx="10" ry="6" fill="#f08f7f" opacity=".55"/>
  <!-- paw -->
  <ellipse cx="302" cy="326" rx="17" ry="9" fill="#f8deb2"/>
</svg>