<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Energy profile</title>
    <meta name="description" content="Hour-by-hour energy and activity diary for fatigue management." />
    <meta name="theme-color" content="#1f5a66" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Energy" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="titles">
          <div class="titlerow">
            <h1 id="app-title"></h1>
            <button class="infobtn" id="about-toggle" type="button" aria-expanded="false" aria-controls="app-subtitle">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-5M12 8h.01" />
              </svg>
            </button>
          </div>
          <p class="sub" id="app-subtitle" hidden></p>
        </div>
        <div class="headctl">
          <div class="tabs" role="tablist">
            <button id="tab-day" role="tab" aria-selected="true"></button>
            <button id="tab-trends" role="tab" aria-selected="false"></button>
          </div>
          <button class="iconbtn" id="open-settings" type="button">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div id="sample-banner" class="banner" hidden>
        <p><b id="sample-title"></b> <span id="sample-text"></span></p>
        <button class="btn primary" id="start-diary"></button>
      </div>

      <main>
        <section id="view-day"></section>
        <section id="view-trends" hidden></section>
      </main>
    </div>

    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript>This app needs JavaScript.</noscript>
  </body>
</html>
